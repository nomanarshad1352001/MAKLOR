<!doctype html>
<html lang="en" data-theme="gold">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Prevent theme flash — resolve palette before first paint */
      try {
        var saved = localStorage.getItem("mk-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : "gold";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maklor — The Operating Infrastructure for Swiss Real Estate</title>
    <meta name="description" content="From the first discreet signal to the signed deed at the notary. Maklor is the operational intelligence platform built for the Swiss mandate. EU-hosted, subject to the nFADP." />
    <meta name="theme-color" content="#0F0A05" />
    <meta property="og:title" content="Maklor — Swiss Real Estate Operating System" />
    <meta property="og:description" content="Signal intelligence, field operations and closing &amp; notary coordination — engineered for the Swiss market." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
